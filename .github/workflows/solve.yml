name: Atlas GFRO Solve

# Triggers when a passport JSON or solver code changes
on:
  push:
    paths:
      - 'passports/**.json'
      - 'atlas-solver/atlas_emitter.py'
      - 'atlas-solver/atlas_geometry_serializer.py'

jobs:
  solve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy

      - name: Run solver on changed passports
        run: |
          mkdir -p ledgers geometry
          for passport in passports/*.json; do
            scene=$(basename "$passport" .json)
            echo "Solving: $scene"
            python atlas-solver/atlas_emitter.py "$passport" "ledgers/${scene}_ledger.json"
            python atlas-solver/atlas_geometry_serializer.py "ledgers/${scene}_ledger.json" "geometry/${scene}_geometry.json"
            echo "Done: geometry/${scene}_geometry.json"
          done

      - name: Commit and PR geometry output
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name  "atlas-solver[bot]"
          git config user.email "atlas-solver@relational.labs"
          git add geometry/ ledgers/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          BRANCH="solve/$(date -u +%Y-%m-%dT%H%M%SZ)"
          git checkout -b "$BRANCH"
          git commit -m "solve: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -u origin "$BRANCH"
          gh pr create \
            --title "solve: $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "Automated Atlas GFRO+BCW solve output." \
            --base main \
            --head "$BRANCH"
          gh pr merge "$BRANCH" --merge --auto
